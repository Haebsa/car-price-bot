name: Car Price Bot

on:
  schedule:
    - cron: "0 * * * *"   # هر یک ساعت
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm start
